<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixZen - Verify Technician</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #F5F3F0;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .card {
        background: white; border-radius: 28px; max-width: 420px; width: 100%;
        padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); text-align: center;
    }
    .avatar {
        width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
        background: #E8E2D8; overflow: hidden; display: flex; align-items: center; justify-content: center;
        font-size: 48px; border: 4px solid #B58B5B;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: 22px; font-weight: 800; color: #1A1A1A; }
    .id { font-family: monospace; font-weight: 700; color: #B58B5B; font-size: 14px; margin-top: 4px; }
    .badge {
        display: inline-block; margin-top: 12px; padding: 5px 16px; border-radius: 20px;
        font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    }
    .badge.active { background: #D1FAE5; color: #047857; }
    .badge.pending { background: #FEF3C7; color: #B45309; }
    .badge.rejected { background: #FEE2E2; color: #B91C1C; }
    .detail-list { text-align: left; margin-top: 24px; border-top: 1px solid #E8E2D8; padding-top: 18px; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
    .detail-row .label { color: #8B8580; }
    .detail-row .value { font-weight: 600; color: #1A1A1A; }
    .footer-note { margin-top: 22px; font-size: 12px; color: #8B8580; line-height: 1.6; }
    .spinner {
        width: 28px; height: 28px; margin: 0 auto;
        border: 3px solid rgba(181,139,91,0.2); border-radius: 50%;
        border-top-color: #B58B5B; animation: spin .8s ease infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand { font-weight: 800; color: #B58B5B; font-size: 15px; margin-bottom: 18px; }
</style>
</head>
<body>

<div class="card" x-data="verifyPage()" x-init="init()">
    <div class="brand">FixZen · Technician Verification</div>

    <template x-if="loading">
        <div style="padding:30px 0;">
            <div class="spinner"></div>
            <p style="margin-top:12px;color:#6B6560;">Verifying…</p>
        </div>
    </template>

    <template x-if="!loading && notFound">
        <div style="padding:20px 0;">
            <div style="font-size:40px;">⚠️</div>
            <p style="margin-top:12px;font-weight:700;">No matching technician found</p>
            <p style="color:#8B8580;font-size:13px;margin-top:6px;">This ID could not be verified. Please contact FixZen support.</p>
        </div>
    </template>

    <template x-if="!loading && tech">
        <div>
            <div class="avatar">
                <template x-if="tech.image_url"><img :src="tech.image_url" :alt="tech.name"></template>
                <template x-if="!tech.image_url"><span>👤</span></template>
            </div>
            <div class="name" x-text="tech.name"></div>
            <div class="id" x-text="'ID: ' + tech.tech_id"></div>
            <span class="badge" :class="tech.status" x-text="(tech.status || 'pending')"></span>

            <div class="detail-list">
                <div class="detail-row"><span class="label">Specialization</span><span class="value" x-text="tech.category"></span></div>
                <div class="detail-row"><span class="label">Experience</span><span class="value" x-text="(tech.experience ?? '-') + ' yrs'"></span></div>
                <div class="detail-row"><span class="label">Service Area</span><span class="value" x-text="tech.area"></span></div>
                <div class="detail-row"><span class="label">Phone</span><span class="value" x-text="maskedPhone()"></span></div>
            </div>

            <div class="footer-note">
                This page confirms the holder is a registered FixZen technician.
                If the status above is not <b>ACTIVE</b>, proceed with caution.
            </div>
        </div>
    </template>
</div>

<script src="fz-technician-verify.js"></script>
</body>
</html>
